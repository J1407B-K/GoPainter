  matchers:
    - type: word
      part: header
      words: ["x-runtime"]
    - type: word
      part: body
      words: ["csrf-param"]

# ---------- 前端库 ----------

- id: jquery
  name: jQuery
  matchers:
    - type: word
      part: script
      words: ["jquery"]

- id: vue
  name: Vue.js
  matchers-condition: or
  matchers:
    - type: word
      part: script
      words: ["vue.min.js", "vue.js", "vue@"]
