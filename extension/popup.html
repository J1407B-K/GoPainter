<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2329;
      --muted: #8a919e;
      --accent: #6366f1;
      --accent-soft: #eef0ff;
      --green: #16a34a;
      --green-soft: #f0fdf4;
      --border: #e8eaef;
      --mono: "SF Mono", Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html, body { width: 380px; max-width: 380px; overflow-x: hidden; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 13px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* 顶部横幅 */
    .banner {
      padding: 14px 16px 12px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 60%, #a855f7 100%);
      color: #fff;
    }
    .banner h1 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 6px; }
    .banner .sub { font-size: 11px; opacity: .8; margin-top: 2px; }

    .container { padding: 12px 14px 14px; }

    /* 页面信息卡 */
    .page-info {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 12px;
    }
    .page-info .title { font-weight: 600; font-size: 13px; word-break: break-all; }
    .page-info .title-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .favicon { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
    .favicon.matched { box-shadow: 0 0 0 2px var(--green), 0 0 6px rgba(22, 163, 74, .4); }
    .page-info .url {
      color: var(--muted); font-size: 11px; font-family: var(--mono);
      word-break: break-all; margin-top: 2px;
    }
    .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-family: var(--mono);
      padding: 2px 8px; border-radius: 999px;
      background: #f1f2f6; color: #555; border: 1px solid var(--border);
    }
    .chip.ok { background: var(--green-soft); color: var(--green); border-color: #bbf7d0; }

    /* 命中卡片 */
    .section-label {
      font-size: 11px; color: var(--muted); text-transform: uppercase;
      letter-spacing: .5px; margin: 4px 2px 6px;
    }
    .conf-note {
      margin: 0 2px 8px; color: var(--muted);
      font-size: 11px;
    }
    .hit {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 8px;
      border-left: 3px solid var(--green);
      animation: slide-in .18s ease-out;
    }
    @keyframes slide-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    .hit .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; min-width: 0; }
    .hit .name { min-width: 0; font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
    .hit .tail { display: flex; align-items: center; gap: 6px; flex-shrink: 0; max-width: 45%; min-width: 0; }
    .hit .id {
      min-width: 0; color: var(--muted); font-size: 10px; font-family: var(--mono);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 置信度徽章：高强弱三档配色 */
    .hit .conf {
      flex-shrink: 0;
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      padding: 1px 7px; border-radius: 999px;
    }
    .hit .conf.high { background: var(--green-soft); color: var(--green); border: 1px solid #bbf7d0; }
    .hit .conf.mid { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .hit .conf.low { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .hit .conf.none { background: #f1f2f6; color: var(--muted); border: 1px solid var(--border); }
    .hit .evidence { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .ev {
      display: flex; gap: 6px; align-items: flex-start; min-width: 0;
      font-size: 11px; padding: 4px 8px; border-radius: 6px;
      background: var(--accent-soft);
    }
    .ev .tag {
      flex-shrink: 0; font-family: var(--mono); font-size: 10px; font-weight: 700;
      color: var(--accent); background: #fff; border: 1px solid #dfe2ff;
      padding: 1px 6px; border-radius: 4px;
    }
    .ev .detail { min-width: 0; font-family: var(--mono); color: #444; overflow-wrap: anywhere; }

    .empty {
      text-align: center; color: var(--muted); padding: 18px 0 10px; font-size: 12px;
    }
    .empty .icon { font-size: 26px; display: block; margin-bottom: 6px; }

    /* 底部操作小卡片 */
    .footer { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .action-card {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 0 8px; background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer; transition: all .15s; user-select: none;
    }
    .action-card:hover { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .action-card.disabled { opacity: .5; pointer-events: none; }
    /* 爬取中：置灰但仍可点击（点了打开侧栏看进度） */
    .action-card.running { opacity: .5; }
    .action-card.running .ac-icon { animation: pulse .8s ease-in-out infinite; }
    .ac-icon { font-size: 17px; }
    .ac-label { max-width: 100%; font-size: 11px; color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .action-card.busy .ac-icon { animation: pulse .8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .3; } }

    button {
      flex: 1; padding: 8px 0; border: none; border-radius: 8px; cursor: pointer;
      font-size: 12px; font-weight: 600; transition: all .15s;
    }
    button.ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); }
    button.ghost:hover:not(:disabled) { background: #f0f1f5; }
    button.ghost:disabled { opacity: .6; cursor: wait; }

    #rule-area { display: none; margin-top: 10px; }
    #rule-name-input {
      width: 100%; padding: 8px 10px; margin-bottom: 8px;
      border: 1px solid var(--border); border-radius: 8px; font-size: 12px;
    }
    #rule-name-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    #rule-yaml {
      margin: 0; padding: 10px 12px; font-size: 11px; font-family: var(--mono);
      background: #1f2329; color: #e6e6e6; border-radius: 10px;
      max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-all;
    }
    .rule-actions { display: flex; gap: 8px; margin-top: 8px; }
    .rule-actions button { flex: 1; }
    #rule-save { background: var(--green); color: #fff; }
    #rule-save:hover:not(:disabled) { background: #15803d; }
    .link-btn {
      flex: none; padding: 8px 12px; background: var(--card);
      border: 1px solid var(--border); color: var(--text); text-decoration: none;
      text-align: center; font-size: 12px; font-weight: 600; border-radius: 8px;
    }
    .link-btn:hover { background: #f0f1f5; }

    /* AI 候选列表：紫色系，与规则命中（绿色左边框）区分 */
    #ai-result { display: none; margin-top: 10px; }
    #ai-candidates { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow: auto; }
    .candidate {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; border-left: 3px solid var(--accent);
    }
    .candidate .head { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .candidate .head input[type=checkbox] { flex-shrink: 0; accent-color: var(--accent); }
    .candidate .name { min-width: 0; font-weight: 700; font-size: 13px; overflow-wrap: anywhere; flex: 1; }
    .candidate .conf {
      flex-shrink: 0; font-family: var(--mono); font-size: 10px; font-weight: 700;
      padding: 1px 7px; border-radius: 999px;
    }
    .conf.high { background: var(--green-soft); color: var(--green); border: 1px solid #bbf7d0; }
    .conf.mid { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
    .conf.low { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .conf.none { background: #f1f2f6; color: var(--muted); border: 1px solid var(--border); }
    .candidate .actions { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .tag-st {
      font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
    }
    .tag-st.has-rule { background: var(--green-soft); color: var(--green); border: 1px solid #bbf7d0; }
    .tag-st.has-hit { background: #f1f2f6; color: var(--muted); border: 1px solid var(--border); }
    .tag-st.new { background: var(--accent-soft); color: var(--accent); border: 1px solid #dfe2ff; }
    .opt-btn {
      flex: none; font-size: 11px; padding: 3px 10px; border-radius: 6px;
      background: var(--accent-soft); color: var(--accent); border: 1px solid #dfe2ff;
      font-weight: 600; cursor: pointer;
    }
    .opt-btn:hover { background: #dfe2ff; }
    #ai-merge {
      margin-top: 10px; width: 100%; padding: 8px 0; border: none; border-radius: 8px;
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    #ai-merge:hover { background: #4f46e5; }
    #ai-merge:disabled { opacity: .5; cursor: wait; }
    #ai-raw {
      margin-top: 10px; padding: 10px 12px; white-space: pre-wrap; word-break: break-all;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      font-size: 12px; max-height: 240px; overflow: auto;
    }
    /* AI 合并进命中列表的卡片：紫色左边框 + AI 徽章 */
    .hit.hit-ai { border-left-color: var(--accent); }
    .ai-badge {
      flex-shrink: 0; font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
      background: var(--accent); color: #fff;
    }
    .hit .opt-btn { margin-top: 8px; }
    .modal-backdrop {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      padding: 16px; background: rgba(31, 35, 41, .35); z-index: 10;
    }
    .modal {
      width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px; box-shadow: 0 12px 30px rgba(31, 35, 41, .18);
    }
    .modal h2 { margin: 0 0 8px; font-size: 14px; }
    .modal label { display: block; margin: 10px 0 4px; font-weight: 700; font-size: 12px; }
    .modal input {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 12px; font-family: var(--mono);
    }
    .modal input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
    .modal-actions button { flex: 1; }
    #crawl-start-popup { background: var(--accent); color: #fff; }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="banner">
    <h1>🎨 GoPainter</h1>
    <div class="sub">Web 指纹测绘 · Go WASM 引擎</div>
  </div>

  <div class="container">
    <div class="page-info" id="page-info" style="display:none">
      <div class="title-row">
        <img id="page-favicon" class="favicon" alt="" style="display:none">
        <div class="title" id="page-title"></div>
      </div>
      <div class="url" id="page-url"></div>
      <div class="meta-row" id="meta-row"></div>
    </div>

    <div id="status" class="empty"><span class="icon">⏳</span>加载中…</div>
    <div id="hits"></div>

    <div class="footer">
      <div class="action-card" id="ai-btn" role="button">
        <span class="ac-icon">✨</span><span class="ac-label">AI 识别</span>
      </div>
      <div class="action-card" id="rule-btn" role="button">
        <span class="ac-icon">🛠</span><span class="ac-label">新建规则</span>
      </div>
      <div class="action-card" id="crawl-btn" role="button">
        <span class="ac-icon">🕷</span><span class="ac-label">爬取本站</span>
      </div>
      <div class="action-card" id="settings-btn" role="button">
        <span class="ac-icon">⚙️</span><span class="ac-label">设置</span>
      </div>
    </div>
    <div id="ai-result">
      <div id="ai-candidates"></div>
      <div id="ai-raw" style="display:none"></div>
      <button id="ai-merge" style="display:none">合并选中</button>
    </div>
    <div id="rule-area">
      <div id="rule-mode-label" class="section-label"></div>
      <input id="rule-name-input" type="text" placeholder="技术名，如 WordPress" style="display:none">
      <pre id="rule-yaml"></pre>
      <div class="rule-actions">
        <button id="rule-generate" class="ghost" style="display:none">✨ 生成</button>
        <button id="rule-save">✅ 保存规则</button>
        <button id="rule-discard" class="ghost">丢弃</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="crawl-modal">
    <div class="modal" role="dialog" aria-labelledby="crawl-modal-title">
      <h2 id="crawl-modal-title">爬取本站</h2>
      <label for="crawl-url-popup">起始 URL</label>
      <input type="text" id="crawl-url-popup">
      <label for="crawl-max-popup">最大页数</label>
      <input type="text" id="crawl-max-popup" placeholder="留空 = 不限">
      <div class="modal-actions">
        <button id="crawl-start-popup">开始爬取</button>
        <button id="crawl-cancel-popup" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <script src="shared-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
