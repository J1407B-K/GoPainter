name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 用当前 Go 工具链从源码安装，避免预编译 lint 二进制的 Go 版本
      # 落后于 go.mod，也避免 action 运行时的 Node 依赖警告。
      - name: Install Go lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Go lint
        run: make lint-go

      # 生产用标准 Go wasm（见 BENCHMARK.md：无 TinyGo GC 尾延迟尖峰）
      - name: Build wasm
        run: make build

      - name: Test
        run: make test

      - name: Browser E2E
        run: make test-browser-e2e
