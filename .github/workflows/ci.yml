name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 生产用标准 Go wasm（见 BENCHMARK.md：无 TinyGo GC 尾延迟尖峰）
      - name: Build wasm
        run: make build

      - name: Test
        run: make test
