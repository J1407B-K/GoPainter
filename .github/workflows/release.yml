name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 建 release 要这个

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 生产发布标准 Go wasm（见 BENCHMARK.md）
      - name: Build wasm
        run: make build

      - name: Test
        run: make test

      - name: Browser E2E
        run: make test-browser-e2e

      - name: Package extension
        run: |
          cd extension
          zip -r ../gopainter-${{ github.ref_name }}.zip . -x 'wasm/matcher.wasm.map'
          cd ..
          sha256sum gopainter-${{ github.ref_name }}.zip > gopainter-${{ github.ref_name }}.zip.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gopainter-${{ github.ref_name }}.zip
            gopainter-${{ github.ref_name }}.zip.sha256
          generate_release_notes: true
